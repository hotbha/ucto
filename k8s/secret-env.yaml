apiVersion: v1
kind: Secret
metadata:
  name: ucto-env-secrets
  namespace: ucto
type: Opaque
stringData:
  # Database
  DATABASE_URL: "jdbc:postgresql://ucto-postgres:5432/ucto_db"
  DATABASE_USER: "ucto"
  DATABASE_PASSWORD: "rADHASOAMI@356"

  # Redis
  REDIS_HOST: "ucto-redis"
  REDIS_PORT: "6379"

  # JWT
  JWT_ACCESS_EXPIRATION: "3600000"
  JWT_REFRESH_EXPIRATION: "604800000"

  # Chargebee (placeholder — fill with real values)
  CHARGEBEE_SITE: "ucto-test"
  CHARGEBEE_API_KEY: "test_api_key"

  # SMTP — ZOHO
  SMTP_HOST: "smtp.zoho.com"
  SMTP_PORT: "587"
  SMTP_USERNAME: "noreply@ucto.app"
  SMTP_PASSWORD: "your_smtp_password"

  # Fast2SMS
  FAST2SMS_SENDER_ID: "UCTOAP"
  FAST2SMS_BASE_URL: "https://www.fast2sms.com/dev/bulkV2"

  # CORS
  CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:8080"

  # Sentry (optional)
  SENTRY_DSN: ""
  SENTRY_ENVIRONMENT: "development"
