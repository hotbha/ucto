# UCTO - NGINX Configuration
# =============================================================================
# Production deployment with SSL via Let's Encrypt (Certbot)
# =============================================================================
# 
# Setup instructions:
#   1. Point your domain (ucto.app) to this server's IP
#   2. Install certbot: sudo apt install certbot python3-certbot-nginx
#   3. Run: sudo certbot --nginx -d ucto.app -d www.ucto.app -d app.ucto.app
#   4. Certbot will auto-update this file with SSL config
#
# For local development, use the server block below (port 80, localhost)
# =============================================================================

# =============================================================================
# HTTP -> HTTPS Redirect (Production)
# =============================================================================
server {
    listen 80;
    server_name ucto.app www.ucto.app app.ucto.app;
    return 301 https://$host$request_uri;
}

# =============================================================================
# HTTPS Server (Production with SSL)
# =============================================================================
server {
    listen 443 ssl http2;
    server_name ucto.app www.ucto.app app.ucto.app;

    # SSL certificates (managed by certbot)
    ssl_certificate /etc/letsencrypt/live/ucto.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ucto.app/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/ucto.app/chain.pem;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Frontend (Flutter Web)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Cache static assets
        location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Do not cache index.html (Flutter service worker needs fresh version)
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }

    # Backend API proxy
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;

        # Buffer sizes
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
        proxy_busy_buffers_size 32k;

        # Body size (for screen uploads)
        client_max_body_size 50m;
    }

    # Health check endpoint (no auth required)
    location /api/health {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# =============================================================================
# Local Development (no SSL)
# =============================================================================
server {
    listen 80;
    server_name localhost;

    # Frontend (Flutter Web)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Backend API proxy
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;
    }
}
