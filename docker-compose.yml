# UCTO - MVP Docker Compose Configuration
version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: ucto-postgres
    environment:
      POSTGRES_DB: ucto_db
      POSTGRES_USER: ucto
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ucto-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ucto"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Cache & Message Queue
  redis:
    image: redis:7-alpine
    container_name: ucto-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ucto-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Spring Boot Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ucto-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ucto_db
      SPRING_DATASOURCE_USERNAME: ucto
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JWT_SECRET: ucto-backend-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ucto-network

  # Flutter Web Frontend (NGINX)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ucto-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - ucto-network

volumes:
  postgres_data:
  redis_data:

networks:
  ucto-network:
    driver: bridge
