<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UCTO - Agentic AI Platform</title>
  <meta name="description" content="Build your startup app with AI-powered agents">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    body { margin: 0; padding: 0; background: #0F172A; }
    #ucto-loader {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #0F172A;
    }
    .loader-content {
      text-align: center;
    }
    .loader-logo {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #7C3AED, #6D28D9);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      font-size: 28px;
      font-weight: bold;
      color: white;
    }
    .loader-text {
      color: #F1F5F9;
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 2px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .loader-sub {
      color: #94A3B8;
      font-size: 13px;
      margin-top: 8px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .loader-spinner {
      width: 24px;
      height: 24px;
      border: 3px solid #334155;
      border-top-color: #7C3AED;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin: 24px auto 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="ucto-loader">
    <div class="loader-content">
      <div class="loader-logo">U</div>
      <div class="loader-text">UCTO</div>
      <div class="loader-sub">Loading...</div>
      <div class="loader-spinner"></div>
    </div>
  </div>
  <script src="flutter.js" defer></script>
  <script>
    window.addEventListener('load', function() {
      const loader = document.getElementById('ucto-loader');
      setTimeout(() => {
        if (loader) loader.style.display = 'none';
      }, 3000);
    });
  </script>
</body>
</html>
