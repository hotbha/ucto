# Test profile with H2 + mocked Redis/Chargebee/Mail
spring.application.name=ucto-backend-test

# H2 in-memory database for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Redis - mocked in TestRedisConfig, not needed for pure unit tests
spring.data.redis.host=localhost
spring.data.redis.port=6379

# JWT
jwt.secret=test-jwt-secret-key-that-is-at-least-256-bits-long-for-testing
jwt.access-token-expiration=3600000
jwt.refresh-token-expiration=604800000

# Chargebee (mocked)
chargebee.site=test-site
chargebee.api.key=test_key

# Server
server.port=0

# Mail (mocked via TestRedisConfig JavaMailSender bean)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=test@test.com
spring.mail.password=test

# Disable Redis auto-config in test context (avoids need for real Redis server)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
