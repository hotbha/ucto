spring.application.name=ucto-backend

# Database — all driven by env vars (see .env.example)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Redis
spring.data.redis.host= ${REDIS_HOST}
spring.data.redis.port= ${REDIS_PORT}
spring.data.redis.password= ${REDIS_PASSWORD}

# JWT
jwt.secret= ${JWT_SECRET}
jwt.access-token-expiration= ${JWT_ACCESS_EXPIRATION}
jwt.refresh-token-expiration= ${JWT_REFRESH_EXPIRATION}

# Chargebee
chargebee.site=${CHARGEBEE_SITE_TEST}
chargebee.api.key=${CHARGEBEE_API_KEY_TEST}

# Server — bind address and port driven by env vars (default 0.0.0.0:8080)
server.address=${SERVER_HOST}
server.port=${SERVER_PORT}

# Zoho SMTP (for email verification & password reset)
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# App base URL (used in email links) — compose from SERVER_HOST / SERVER_PORT
app.base-url=http://${SERVER_HOST}:${SERVER_PORT}

# CORS — comma-separated list of allowed origins (frontend URLs)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Sentry Error Monitoring (optional — set SENTRY_DSN env var to enable)
sentry.dsn= ${SENTRY_DSN}
sentry.environment= ${SENTRY_ENVIRONMENT}
