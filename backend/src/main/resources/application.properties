spring.application.name=ucto-backend

# Database — all driven by env vars (see .env.example)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}

# JWT
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION}
jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION}

# Chargebee
chargebee.site=${CHARGEBEE_SITE}
chargebee.api.key=${CHARGEBEE_API_KEY}

# Server — bind address and port driven by env vars (default 0.0.0.0:8080)
server.address=${SERVER_HOST}
server.port=${SERVER_PORT}

# Zoho SMTP (for email verification & password reset)
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# App base URL (used in email links) — compose from SERVER_HOST / SERVER_PORT
app.base-url=http://${SERVER_HOST}:${SERVER_PORT}

# CORS — comma-separated list of allowed origins (frontend URLs)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Agent — repo-aware developer agent
ucto.agent.developer.workspace-base=${UCTO_WORKSPACE_BASE:/tmp/ucto/workspaces}
ucto.agent.developer.clone-timeout=120
ucto.agent.developer.fetch-timeout=60

# Bootstrap — prompt-to-app project creation
ucto.bootstrap.enabled=true
ucto.bootstrap.workspace-base=${UCTO_BOOTSTRAP_BASE:/tmp/ucto/bootstrap-skeletons}
ucto.bootstrap.default-stack=SPRING_REACT

# Quality gates
ucto.gates.enabled=true
ucto.gates.coverage-threshold=80
ucto.gates.simulation-mode=false
ucto.gates.require-pm-approval=true

# LLM — DeepSeek (optional; if unset, stub client is used)
ucto.llm.deepseek.api-url=https://api.deepseek.com/v1/chat/completions
ucto.llm.deepseek.api-key=${DEEPSEEK_API_KEY:}
ucto.llm.deepseek.model=deepseek-chat
ucto.llm.deepseek.timeout-ms=30000
ucto.llm.deepseek.max-tokens=2048
ucto.llm.deepseek.temperature=0.3

# Fast2SMS — OTP / SMS verification
fast2sms.api.key=${FAST2SMS_API_KEY}
fast2sms.sender.id=${FAST2SMS_SENDER_ID:UCTOAP}
fast2sms.base.url=${FAST2SMS_BASE_URL:https://www.fast2sms.com/dev/bulkV2}

# Sentry Error Monitoring (optional — set SENTRY_DSN env var to enable)
sentry.dsn=${SENTRY_DSN}
sentry.environment=${SENTRY_ENVIRONMENT}
