spring.application.name=ucto-backend

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/ucto_db
spring.datasource.username=ucto
spring.datasource.password=rADHASOAMI@356
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Redis
spring.data.redis.host=0.0.0.0
spring.data.redis.port=6379

# JWT
jwt.secret=ucto-backend-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256
jwt.access-token-expiration=3600000
jwt.refresh-token-expiration=604800000

# Chargebee
chargebee.site=ucto-test
chargebee.api.key=test_api_key

# Server
server.port=8080

# Zoho SMTP (for email verification & password reset)
spring.mail.host=smtp.zoho.com
spring.mail.port=587
spring.mail.username=noreply@ucto.app
spring.mail.password=change_me_in_production
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# App base URL (used in email links)
app.base-url=http://localhost:3000

# Sentry Error Monitoring (optional — set SENTRY_DSN env var to enable)
sentry.dsn=
sentry.environment=development
