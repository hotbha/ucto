# =============================================================================
# UCTO Backend - Production Configuration (sensitive values via env vars)
# =============================================================================

spring.application.name=ucto-backend

# Database (PostgreSQL)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

# JWT
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION}
jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION}

# Chargebee
chargebee.site=${CHARGEBEE_SITE}
chargebee.api.key=${CHARGEBEE_API_KEY}

# Server — bind address and port driven by env vars
server.address=${SERVER_HOST}
server.port=${SERVER_PORT}

# Logging
logging.level.com.ucto=INFO
logging.level.org.springframework.security=INFO
